name: Security Scan on Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Security scan via Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git diff HEAD~1 HEAD | head -c 10000 > /tmp/diff.txt
          test -s /tmp/diff.txt || { echo 'No diff, skipping'; exit 0; }
          python3 - <<'PYEOF'
          import json, os, re, urllib.request, urllib.error
          diff = open('/tmp/diff.txt').read()
          prompt = (
              'Review this git diff for security vulnerabilities: hardcoded secrets, API keys, '
              'injection, XSS, auth bypass, OWASP Top 10.\n'
              'Respond with ONLY a raw JSON object, no markdown, no explanation:\n'
              '{"issues": false, "summary": "", "findings": []}\n'
              'Set issues to true only if you find real vulnerabilities.\n\nDiff:\n' + diff
          )
          payload = json.dumps({
              'model': 'claude-3-5-haiku-20241022',
              'max_tokens': 1024,
              'messages': [{'role': 'user', 'content': prompt}]
          }).encode()
          req = urllib.request.Request(
              'https://api.anthropic.com/v1/messages', data=payload,
              headers={'x-api-key': os.environ['ANTHROPIC_API_KEY'],
                       'anthropic-version': '2023-06-01', 'content-type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req) as r: resp = json.load(r)
          except urllib.error.HTTPError as e:
              print('API error:', e.code, e.read().decode()); exit(0)
          text = resp.get('content', [{}])[0].get('text', '')
          print('Claude response:', text[:300])
          match = re.search(r'\{.*?"issues".*?\}', text, re.DOTALL)
          if not match:
              print('No JSON found, assuming no issues'); exit(0)
          try:
              result = json.loads(match.group())
          except Exception:
              print('JSON parse failed, assuming no issues'); exit(0)
          if not result.get('issues'):
              print('No security issues found'); exit(0)
          sha = os.environ['SHA']; repo = os.environ['REPO']
          body = '## Security issues in commit ' + sha[:8] + '\n\n' + result.get('summary', '') + '\n\n'
          body += ''.join('- ' + f + '\n' for f in result.get('findings', []))
          issue_data = json.dumps({
              'title': 'Security issue in commit ' + sha[:8],
              'body': body, 'labels': ['security']
          }).encode()
          req2 = urllib.request.Request(
              'https://api.github.com/repos/' + repo + '/issues', data=issue_data,
              headers={'Authorization': 'token ' + os.environ['GH_TOKEN'],
                       'Content-Type': 'application/json'}
          )
          with urllib.request.urlopen(req2) as r2:
              print('Issue created:', json.load(r2)['html_url'])
          PYEOF

